# MuxCode Model Configuration
# Configure available models per provider for the provider selector and hot reload.
# Manage with: muxcode model list|add|remove
#
# Format: one model per line. Lines starting with # are hidden from the selector.
# Provider sections: [provider-name] (matches CLI identifier)
# Default directive: # default: <model> (sets the default model for the provider)

[claude]
# default: claude-sonnet-5
claude-fable-5
claude-opus-5
claude-sonnet-5
claude-haiku-4-5

[opencode]
# Latest version of each opencode-go family, verified against `opencode models`.
# Parallel tiers at that same newest version are all kept (deepseek pro/flash,
# mimo pro/base, qwen max/plus); superseded versions are not.
# default: opencode-go/minimax-m3
opencode-go/grok-4.6
opencode-go/gpt-5.6-luna
opencode-go/glm-5.3
opencode-go/kimi-k3
opencode-go/minimax-m3
opencode-go/mimo-v2.5-pro
opencode-go/mimo-v2.5
opencode-go/qwen3.8-max
opencode-go/qwen3.7-plus
opencode-go/deepseek-v4-pro
opencode-go/deepseek-v4-flash
opencode-go/hy3

[codex]
# default: gpt-5.5
gpt-5.5
gpt-5.4-mini
gpt-5.3-codex-spark
