# muxcode tmux configuration snippet
# Add to your .tmux.conf: source-file ~/.config/muxcode/tmux.conf

# --- F-key window switching (F1-F10) ---
# Quick navigation between agent windows without prefix key
# Window order: plan(1) edit(2) build(3) test(4) review(5) deploy(6) run(7) watch(8) commit(9) analyze(10)
bind -n F1 select-window -t:1
bind -n F2 if-shell -F '#{==:#{window_index},2}' \
  'run-shell "muxcode mode cycle >/dev/null 2>&1"' \
  'select-window -t:2'
bind -n F3 select-window -t:3
bind -n F4 select-window -t:4
bind -n F5 select-window -t:5
bind -n F6 select-window -t:6
bind -n F7 select-window -t:7
bind -n F8 select-window -t:8
bind -n F9 select-window -t:9
bind -n F10 select-window -t:10

# --- Mode cycling keybindings ---
# prefix + a — cycle agent modes on the edit window regardless of current window
bind a run-shell 'muxcode mode cycle >/dev/null 2>&1'

# --- Modal keybindings ---
# API Testing modal (prefix + i) — opens as popup overlay, not a window
bind i run-shell 'muxcode modal open api'

# --- Session picker popup (prefix + C) ---
# Opens muxcode project picker in a tmux popup
bind C display-popup -E -w 60% -h 50% -T " New Session " "TMUX_POPUP=1 muxcode"

# --- MuxCode quick menu (prefix + b) ---
# Pop-up menu above the session name with common MuxCode operations
bind b display-menu -T " MuxCode " -x 0 -y S \
  "New Session"             n "display-popup -E -w 60% -h 50% -T ' New Session ' 'TMUX_POPUP=1 muxcode'" \
  "Switch Session"          s "display-popup -E -w 60% -h 50% -T ' Switch Session ' 'muxcode-switch-session.sh'" \
  "Dashboard"               t "display-popup -E -w 80% -h 80% -T ' Dashboard ' 'muxcode dashboard'" \
  "API Testing"             i "run-shell 'muxcode modal open api'" \
  "" \
  "Agent Status"            a "display-popup -E -w 70% -h 60% -T ' Agent Status ' 'muxcode status; echo; read -n1 -p \"Press any key...\"'" \
  "Agent History"           h "command-prompt -p 'Agent role:' \"display-popup -E -w 80% -h 70% -T ' History: %%' 'muxcode history %%; echo; read -n1 -p \\\"Press any key...\\\"'\"" \
  "Memory Context"          m "display-popup -E -w 80% -h 70% -T ' Memory ' 'muxcode memory context; echo; read -n1 -p \"Press any key...\"'" \
  "" \
  "Spawn Agent"             p "command-prompt -p 'Role:,Task:' \"display-popup -E -w 70% -h 50% -T ' Spawn: %%' 'muxcode spawn start %% \\\"%2\\\"; echo; read -n1 -p \\\"Press any key...\\\"'\"" \
  "List Processes"          l "display-popup -E -w 70% -h 50% -T ' Processes ' 'muxcode proc list; echo; echo \"---\"; muxcode spawn list; echo; read -n1 -p \"Press any key...\"'" \
  "Cron Jobs"               c "display-popup -E -w 70% -h 50% -T ' Cron Jobs ' 'muxcode cron list; echo; read -n1 -p \"Press any key...\"'" \
  "" \
  "Compact Session"         k "command-prompt -p 'Summary:' \"run-shell 'muxcode session compact \\\"%1\\\"'\"" \
  "Save Memory"             S "display-popup -E -w 70% -h 50% -T ' Save Memory ' 'muxcode memory context; echo; read -n1 -p \"Press any key...\"'" \
  "Cleanup Bus"             x "confirm-before -p 'Clean up bus session? (y/n)' \"run-shell 'muxcode cleanup'\"" \
  "" \
  "Edit Config"             e "display-popup -E -w 80% -h 80% -T ' Edit Config ' 'nvim ~/.config/muxcode/tmux.conf'" \
  "Reload Config"           r "run-shell 'tmux source-file ~/.config/muxcode/tmux.conf; tmux display-message \"Config reloaded\"'" \
  "" \
  "Detach Session"          d detach-client \
  "Quit Session"            q "confirm-before -p 'Kill this MuxCode session? (y/n)' kill-session" \
  "Exit MuxCode"            X "confirm-before -p 'Kill the tmux server and ALL sessions? (y/n)' \"run-shell 'kill #{pid}'\""

# --- Destructive action confirmations ---
# Override defaults to require confirmation — prevents accidental disconnects and kills.
# Note: prefix+x (kill-pane) and prefix+& (kill-window) already confirm by default.
bind d confirm-before -p 'Detach from this session? (y/n)' detach-client
bind X confirm-before -p 'Kill this MuxCode session? (y/n)' kill-session
set -s command-alias[0] kill-server='confirm-before -p "Kill the tmux server and ALL sessions? (y/n)" "run-shell \"kill #{pid}\""'

# --- Vim-tmux navigator integration ---
# Seamless Ctrl-h/j/k/l navigation between tmux and nvim panes
# Requires: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Capitalized window labels ---
# Uses #{@display-name} (per-window user option set by muxcode.sh) for
# instant synchronous rendering. Index 0 hiding during F2 mode cycling is
# handled by per-window format overrides in mode.go — no conditional needed.
# (tmux #{?} conditionals break when #[] style escapes contain commas.)
set -g window-status-format \
  '#[fg=#282a36,bg=#44475a]#[fg=#f8f8f2,bg=#44475a] F#I #{@display-name} #[fg=#44475a,bg=#282a36]'
set -g window-status-current-format \
  '#[fg=#282a36,bg=#50fa7b]#[fg=#282a36,bg=#50fa7b] F#I*#[fg=#282a36,bg=#50fa7b,bold] #{@display-name} #[fg=#50fa7b,bg=#282a36]'

# --- Transparency ---
# Use 'default' background to inherit terminal transparency (matches OpenCode TUI).
# Overrides the solid Dracula #282a36 background from the user's base tmux.conf.
set -g status-style 'bg=default,fg=#f8f8f2'
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# --- Resize behavior ---
# Aggressive resize works better with tiling window managers
set -g aggressive-resize on
