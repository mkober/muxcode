# muxcode tmux configuration snippet
# Add to your .tmux.conf: source-file ~/.config/muxcode/tmux.conf

# --- F-key window switching (F1-F10) ---
# Quick navigation between agent windows without prefix key
# Window order: plan(1) edit(2) build(3) test(4) serve(5) review(6) deploy(7) run(8) watch(9) commit(10)
bind -n F1 if-shell -F '#{==:#{window_index},1}' \
  'run-shell "muxcode mode cycle --window plan >/dev/null 2>&1"' \
  'select-window -t:1'
bind -n F2 if-shell -F '#{==:#{window_index},2}' \
  'run-shell "muxcode mode cycle >/dev/null 2>&1"' \
  'select-window -t:2'
bind -n F3 select-window -t:3
bind -n F4 select-window -t:4
bind -n F5 select-window -t:5
bind -n F6 select-window -t:6
bind -n F7 select-window -t:7
bind -n F8 select-window -t:8
bind -n F9 select-window -t:9
bind -n F10 select-window -t:10

# --- Mode cycling keybindings ---
# prefix + a — cycle auto/edit modes on the edit window regardless of current window
bind a run-shell 'muxcode mode cycle >/dev/null 2>&1'
# prefix + r — cycle plan/research modes on the plan window regardless of current window
bind r run-shell 'muxcode mode cycle --window plan >/dev/null 2>&1'

# --- Layout keys ---
# H = stacked (tmux even-vertical), V = side-by-side (even-horizontal).
# Letter keys deliberately: braces/brackets need quoting in a config file, and an
# unquoted `bind }` is a syntax error that aborts the rest of this file.
# No rotate-window: it reassigns pane indices (pane 1 flips agent<->nvim),
# breaking PaneTarget() delivery — rotation waits on dynamic AgentPane() (MUX-104).
bind H select-layout even-vertical
bind V select-layout even-horizontal

# --- Popup style alias ---
# All popups use this alias for consistent Dracula-themed borders.
# Includes -E (close on exit), -b rounded, -S fg=colour141 (purple).
# The -b and -S flags require tmux >= 3.3 — remove them from the alias on older versions.
set -s command-alias[1] popup='display-popup -E -b rounded -S fg=colour141'

# --- Modal keybindings ---
# API Testing modal (prefix + i) — opens as popup overlay, not a window
bind i run-shell 'muxcode modal open api'

# --- Session picker popup (prefix + C) ---
# Opens muxcode project picker in a tmux popup
bind C run-shell "muxcode popup session-picker"

# --- MuxCode quick menu (prefix + b) ---
# Pop-up menu above the session name with common MuxCode operations
bind b display-menu -T " MuxCode " -x 0 -y S \
  "New Session"             n "run-shell 'muxcode popup session-picker'" \
  "Switch Session"          s "run-shell 'muxcode popup switch-session'" \
  "API Testing"             i "run-shell 'muxcode modal open api'" \
  "Provider"                R "run-shell 'muxcode modal open provider'" \
  "" \
  "Sessions"                w "run-shell 'muxcode popup remote-sessions'" \
  "Compact Session"         k "command-prompt -p 'Summary:' \"run-shell 'muxcode session compact \\\"%1\\\"'\"" \
  "Save Memory"             S "run-shell 'muxcode popup save-memory'" \
  "Cleanup Bus"             x "confirm-before -p 'Clean up bus session? (y/n)' \"run-shell 'muxcode cleanup'\"" \
  "" \
  "Edit Config"             e "run-shell 'muxcode popup edit-config'" \
  "Reload Config"           r "run-shell 'tmux source-file ~/.config/muxcode/tmux.conf; tmux display-message \"Config reloaded\"'" \
  "" \
  "Detach Session"          d detach-client \
  "Quit Session"            q "confirm-before -p 'Quit this session? (y/n)' \"run-shell 'muxcode session quit'\"" \
  "Exit MuxCode"            X "confirm-before -p 'Kill the tmux server and ALL sessions? (y/n)' \"run-shell 'kill #{pid}'\""

# --- Provider selector shortcut ---
bind R run-shell 'muxcode modal open provider'

# --- Destructive action confirmations ---
# Override defaults to require confirmation — prevents accidental disconnects and kills.
# Note: prefix+x (kill-pane) and prefix+& (kill-window) already confirm by default.
bind d confirm-before -p 'Detach from this session? (y/n)' detach-client
bind X confirm-before -p 'Quit this session? (y/n)' "run-shell 'muxcode session quit'"
set -s command-alias[0] kill-server='confirm-before -p "Kill the tmux server and ALL sessions? (y/n)" "run-shell \"kill #{pid}\""'

# --- Control pane borders (MUX-108) ---
# Global, not per-window: 12 windows must not each re-apply them, and the
# format is inert on two-pane windows (a title renders only when set).
# The s/code-editor/CODE-EDITOR/ substitution uppercases the agent pane's
# CLI-managed title at render time only — the CLI stays authoritative
# over content (it live-updates a state glyph), tmux over presentation.
set -g pane-border-status top
set -g pane-border-format "#{?#{!=:#{pane_title},},#[fg=colour141]#{s/code-editor/CODE-EDITOR/:pane_title},}"
set -g pane-border-style "fg=colour141"

# --- Vim-tmux navigator integration ---
# Seamless Ctrl-h/j/k/l navigation between tmux and nvim panes
# Requires: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Capitalized window labels ---
# Uses #{@display-name} (per-window user option set by muxcode.sh) for
# instant synchronous rendering. Index 0 hiding during F2 mode cycling is
# handled by per-window format overrides in mode.go — no conditional needed.
# (tmux #{?} conditionals break when #[] style escapes contain commas.)
set -g window-status-format \
  '#[fg=#282a36,bg=#44475a]#[fg=#f8f8f2,bg=#44475a] F#I #{@display-name} #[fg=#44475a,bg=#282a36]'
set -g window-status-current-format \
  '#[fg=#282a36,bg=#50fa7b]#[fg=#282a36,bg=#50fa7b] F#I*#[fg=#282a36,bg=#50fa7b,bold] #{@display-name} #[fg=#50fa7b,bg=#282a36]'

# --- Status refresh ---
# Re-run status-bar #() commands (e.g. the branch-time segment) every 15s so the
# live branch-time counter stays current without manual refresh.
set -g status-interval 15

# --- Transparency ---
# Use 'default' background to inherit terminal transparency (matches OpenCode TUI).
# Overrides the solid Dracula #282a36 background from the user's base tmux.conf.
set -g status-style 'bg=default,fg=#f8f8f2'
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# --- Resize behavior ---
# Aggressive resize works better with tiling window managers
set -g aggressive-resize on

# Auto-refit windows when the attached client changes size. Without this, a
# monitor resolution change resizes the terminal app but leaves the tmux
# window at its old geometry, clipping the session until it is recreated. The
# client-resized hook (tmux 3.0+) fires on each terminal resize and refits every
# window so the whole session tracks the new size live with no restart — not
# just the window currently in view. Requires tmux >= 3.0 (a project prereq).
#
# The work is done by `muxcode resize` (bus/resize.go) rather than an inline tmux
# one-liner for two reasons:
#   1. Cross-session coverage. The old inline form used `list-windows` +
#      `resize-window -t :{} -A`, which only ever sees the *current* session, so
#      detached subsessions stayed clipped until you switched to them and
#      resized by hand. `muxcode resize` walks every session via `list-windows -a`.
#   2. Detached sessions. `resize-window -A` fits to the largest *connected*
#      client and is a no-op for a session with no client attached — so even a
#      cross-session one-liner could not refit a detached subsession. `muxcode
#      resize` reads the fit size from an attached window and pushes it to every
#      detached window explicitly (that size is overridden automatically the next
#      time a client attaches, so it does no harm).
# Keeping the logic in Go also means no `#{...}`/`$var` escaping pitfalls in this
# hook string and the behavior is covered by Go unit tests.
set-hook -g client-resized 'run-shell -b "muxcode resize"'
