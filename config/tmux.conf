# muxcode tmux configuration snippet
# Add to your .tmux.conf: source-file ~/.config/muxcode/tmux.conf

# --- F-key window switching (F1-F10) ---
# Quick navigation between agent windows without prefix key
bind -n F1 select-window -t:1
bind -n F2 select-window -t:2
bind -n F3 select-window -t:3
bind -n F4 select-window -t:4
bind -n F5 select-window -t:5
bind -n F6 select-window -t:6
bind -n F7 select-window -t:7
bind -n F8 select-window -t:8
bind -n F9 select-window -t:9
bind -n F10 select-window -t:10

# --- Session picker popup (prefix + C) ---
# Opens muxcode project picker in a tmux popup
bind C display-popup -E -w 60% -h 50% -T " New Session " "TMUX_POPUP=1 muxcode"

# --- MuxCode quick menu (prefix + b) ---
# Pop-up menu above the session name with common MuxCode operations
bind b display-menu -T " MuxCode " -x 0 -y S \
  "New Session"             n "display-popup -E -w 60% -h 50% -T ' New Session ' 'TMUX_POPUP=1 muxcode'" \
  "Switch Session"          s "choose-session" \
  "Dashboard (TUI)"         d "display-popup -E -w 80% -h 80% -T ' Dashboard ' 'muxcode-agent-bus tui'" \
  "" \
  "Agent Status"            a "display-popup -E -w 70% -h 60% -T ' Agent Status ' 'muxcode-agent-bus status; echo; read -n1 -p \"Press any key...\"'" \
  "Agent History"           h "command-prompt -p 'Agent role:' \"display-popup -E -w 80% -h 70% -T ' History: %%' 'muxcode-agent-bus history %%; echo; read -n1 -p \\\"Press any key...\\\"'\"" \
  "Memory Context"          m "display-popup -E -w 80% -h 70% -T ' Memory ' 'muxcode-agent-bus memory context; echo; read -n1 -p \"Press any key...\"'" \
  "" \
  "Spawn Agent"             p "command-prompt -p 'Role:,Task:' \"display-popup -E -w 70% -h 50% -T ' Spawn: %%' 'muxcode-agent-bus spawn start %% \\\"%2\\\"; echo; read -n1 -p \\\"Press any key...\\\"'\"" \
  "List Processes"          l "display-popup -E -w 70% -h 50% -T ' Processes ' 'muxcode-agent-bus proc list; echo; echo \"---\"; muxcode-agent-bus spawn list; echo; read -n1 -p \"Press any key...\"'" \
  "Cron Jobs"               c "display-popup -E -w 70% -h 50% -T ' Cron Jobs ' 'muxcode-agent-bus cron list; echo; read -n1 -p \"Press any key...\"'" \
  "" \
  "Compact Session"         k "command-prompt -p 'Summary:' \"run-shell 'muxcode-agent-bus session compact \\\"%1\\\"'\"" \
  "Save Memory"             S "display-popup -E -w 70% -h 50% -T ' Save Memory ' 'muxcode-agent-bus memory context; echo; read -n1 -p \"Press any key...\"'" \
  "Cleanup Bus"             x "confirm-before -p 'Clean up bus session? (y/n)' \"run-shell 'muxcode-agent-bus cleanup'\"" \
  "" \
  "Kill Session"            K "confirm-before -p 'Kill this MuxCode session? (y/n)' kill-session" \
  "Detach"                  q detach-client

# --- Destructive action confirmations ---
# Override defaults to require confirmation — prevents accidental disconnects and kills.
# Note: prefix+x (kill-pane) and prefix+& (kill-window) already confirm by default.
bind d confirm-before -p 'Detach from this session? (y/n)' detach-client
bind X confirm-before -p 'Kill this MuxCode session? (y/n)' kill-session
set -s command-alias[0] kill-server='confirm-before -p "Kill the tmux server and ALL sessions? (y/n)" "run-shell \"kill #{pid}\""'

# --- Vim-tmux navigator integration ---
# Seamless Ctrl-h/j/k/l navigation between tmux and nvim panes
# Requires: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Resize behavior ---
# Aggressive resize works better with tiling window managers
set -g aggressive-resize on
